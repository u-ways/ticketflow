# Reference template (unsupported): fail when a PR introduces new lint/scanner
# suppressions not present in the base. Tune the pattern list to your stack.
name: Suppression scan

on: pull_request

permissions:
    contents: read

jobs:
    suppression-scan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Fail on newly added suppressions
              env:
                  BASE: ${{ github.event.pull_request.base.sha }}
                  HEAD: ${{ github.event.pull_request.head.sha }}
              run: |
                  PATTERNS='# noqa|# type: ignore|# pragma: no cover|eslint-disable|@ts-ignore|@ts-nocheck|rubocop:disable|nosec|nolint'
                  ADDED=$(git diff "$BASE...$HEAD" --unified=0 \
                      | grep -E '^\+' | grep -vE '^\+\+\+' \
                      | grep -cE "$PATTERNS" || true)
                  REMOVED=$(git diff "$BASE...$HEAD" --unified=0 \
                      | grep -E '^-' | grep -vE '^---' \
                      | grep -cE "$PATTERNS" || true)
                  echo "suppressions added: $ADDED, removed: $REMOVED"
                  if [ "$ADDED" -gt "$REMOVED" ]; then
                      echo "::error::This PR adds $((ADDED - REMOVED)) net new suppression(s). Justify each in review or remove them."
                      exit 1
                  fi
