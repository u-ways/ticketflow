[project]
name = "ticketflow"
version = "0.1.0"
description = "A local orchestrator that reads a dependency graph out of an issue tracker, dispatches coding agents against ready nodes, and lets the target repo's own CI decide whether the work is acceptable."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "U-ways E." }]
requires-python = ">=3.14"
dependencies = [
    "atlassian-python-api>=5.0.3",
    # Pinned exactly: githubkit uses minor versions for breaking changes and
    # tracks GitHub's schema (docs/adrs/0012-toolchain-and-delivery.md).
    "githubkit==0.16.1",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "typer>=0.27.1",
]

[project.scripts]
ticketflow = "ticketflow.cli.app:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "types-psutil>=7.2.2.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticketflow"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra -m 'not e2e'"
markers = [
    "e2e: end-to-end tests that hit real external services (deselected in CI)",
]

[tool.coverage.run]
source = ["src/ticketflow"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
