name: Security

on:
    pull_request:
        branches: [main]
    schedule:
        # Weekly, Monday 06:00 UTC
        - cron: "0 6 * * 1"

permissions:
    contents: read

jobs:
    audit:
        name: Dependency audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v10
              with:
                  enable-cache: true
            - uses: extractions/setup-just@v4
            - name: Audit with pip-audit
              run: just audit
